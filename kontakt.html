<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontakt | Matriks Cattery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=home-mobile-image-3" />
  </head>
  <body class="public-page frame-page contact-page">
    <header class="site-header">
      <a class="brand" href="index.html"><img src="img/logo.jpg" alt="" /></a>
      <button class="nav-toggle" type="button" aria-label="Otvori meni" aria-expanded="false"><span></span><span></span></button>
      <nav class="site-nav" aria-label="Glavna navigacija">
        <a href="index.html">Početna</a>
        <a href="macke.html">Naše mačke</a>
        <a href="macici.html">Naši mačići</a>
        <a href="blog.html">Blog</a>
        <a href="onama.html">O nama</a>
        <a href="rasa.html">O rasi</a>
        <a href="kontakt.html">Kontakt</a>
      </nav>
    </header>
    <main>
      <section class="section contact">
        <div class="contact-copy">
          <h1>Rezervacije i pitanja</h1>
          <p>Za informacije o dostupnim mačićima, planiranim leglima i poseti odgajivačnici, pošaljite poruku ili pozovite.</p>
        </div>
        <form class="contact-form" id="contactForm">
          <label>
            <span data-contact-label="name">Ime i prezime</span>
            <input name="name" type="text" autocomplete="name" required />
          </label>
          <label>
            <span data-contact-label="email">Email</span>
            <input name="email" type="email" autocomplete="email" required />
          </label>
          <label>
            <span data-contact-label="message">Poruka</span>
            <textarea name="message" rows="6" required></textarea>
          </label>
          <button class="button primary" type="submit" data-contact-label="submit">Pošalji</button>
          <p class="form-status" role="status"></p>
        </form>
      </section>
    </main>
    <script src="script.js?v=home-mobile-image-3"></script>
  </body>
</html>
